{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <div class="login-container customer-login">
        <div class="login-box">
            <h2>ĐĂNG NHẬP HOẶC TẠO TÀI KHOẢN</h2>
            <form action="{% url 'login' %}" method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <label for="password">Mật khẩu</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Mật khẩu" required>
                        <span class="eye-icon"></span>
                    </div>
                </div>
                <div class="forgot-password">
                    <a href="#">Quên mật khẩu?</a>
                </div>
                <button type="submit" class="login-btn">ĐĂNG NHẬP</button>
                <div class="login-alt">hoặc đăng nhập bằng</div>
                <div class="social-login">
                    <button class="google-btn">G+ Google</button>
                    <button class="facebook-btn">Facebook</button>
                </div>
                <div class="register">
                    Bạn chưa có tài khoản? <a href="{% url 'register' %}">Đăng ký ngay!</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
